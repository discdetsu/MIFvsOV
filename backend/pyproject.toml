[project]
name = "mifvsov"
version = "2.0.0"
description = "Minute intestinal fluke (MIF) vs Opisthorchis viverrini (OV) egg detection API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "torch>=2.9",
    "torchvision>=0.24",
    "numpy>=2.3",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Vendored YOLOv5 code: keep upstream style for easy diffing.
"app/inference/models/*" = ["B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["app/inference/models/"]
